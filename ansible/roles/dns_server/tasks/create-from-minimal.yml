---
- name: "Retrieving the JSON files"
  # Dynamic path resolves task file from group_vars at runtime
  ansible.builtin.include_tasks: "{{ path_common_firewall_get_backup_files }}"
  vars:
    paths: "{{ backup_dns_server_path }}"
    patterns: "{{ minimal_files_extention }}"

- name: "Creating DNS Server on Interface entries from minimal JSON"
  # Loop requires include_tasks for per-iteration task file execution
  ansible.builtin.include_tasks: "add-entry.yml"
  loop: "{{ backup_files.files | default([]) | sort(attribute='path') }}"
  loop_control:
    loop_var: "file"
    label: "{{ file.path }}"
